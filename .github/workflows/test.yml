# Runs the offline test suite (pytest + moto, and the Node.js lists suite).
# Needs no AWS account or credentials.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - name: Node test dependencies
        working-directory: tests/node
        run: npm ci --no-audit --no-fund
      - name: Discovery documents are up to date
        run: python tools/build_docs.py --check
      - run: python -m pytest -q
