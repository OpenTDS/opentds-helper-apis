  # ===========================================================================
  # V1 API - /v1/<service> and /v1/<service>/{proxy+}, ANY method, Lambda proxy.
  # ===========================================================================
  V1Api:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${AWS::StackName}-v1'
      Description: Test Helper API v1
      EndpointConfiguration:
        Types: [REGIONAL]
      # Bodies of these types reach Lambda byte-exact (base64): CSV imports in
      # Windows-1252/UTF-16, and binary webhook payloads.
      BinaryMediaTypes: ['text/csv', 'application/octet-stream']
      MinimumCompressionSize: 8192

  RootApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${AWS::StackName}-root'
      Description: Test Helper API - domain root (llms.txt, /.well-known/*)
      EndpointConfiguration:
        Types: [REGIONAL]
      MinimumCompressionSize: 8192

  V1RootMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref V1Api
      ResourceId: !GetAtt V1Api.RootResourceId
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DiscoveryFunction.Arn}/invocations'

  V1ProxyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref V1Api
      ParentId: !GetAtt V1Api.RootResourceId
      PathPart: '{proxy+}'

  V1ProxyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref V1Api
      ResourceId: !Ref V1ProxyResource
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DiscoveryFunction.Arn}/invocations'

  RootRootMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RootApi
      ResourceId: !GetAtt RootApi.RootResourceId
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DiscoveryFunction.Arn}/invocations'

  RootProxyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RootApi
      ParentId: !GetAtt RootApi.RootResourceId
      PathPart: '{proxy+}'

  RootProxyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RootApi
      ResourceId: !Ref RootProxyResource
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DiscoveryFunction.Arn}/invocations'

  # ---- /v1/lists
  ListsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref V1Api
      ParentId: !GetAtt V1Api.RootResourceId
      PathPart: 'lists'

  ListsMethod:
