        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ListsFunction.Arn}/invocations'

  # ---- /v1/names
  NamesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref V1Api
      ParentId: !GetAtt V1Api.RootResourceId
      PathPart: 'names'

  NamesMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref V1Api
      ResourceId: !Ref NamesResource
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${NamesFunction.Arn}/invocations'

  NamesProxyResource:
