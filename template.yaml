  LockRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: service
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem]
                Resource:
                  - !GetAtt LockTable.Arn

  PerfRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: service
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:BatchGetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:BatchWriteItem, dynamodb:Query]
                Resource:
                  - !GetAtt PerfTable.Arn

  SmsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: service
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query]
                Resource:
                  - !GetAtt SmsTable.Arn
                  - !Sub '${SmsTable.Arn}/index/*'
              - Effect: Allow
                Action: [sns:Publish]
                Resource:
                  - '*'

  VoiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: service
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [polly:SynthesizeSpeech, polly:DescribeVoices]
                Resource:
                  - '*'
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${BucketPrefix}-voice-${AWS::AccountId}-${AWS::Region}/*'
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${BucketPrefix}-voice-${AWS::AccountId}-${AWS::Region}'
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem]
                Resource:
                  - !GetAtt VoiceTable.Arn

  StatelessRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'

  # ===========================================================================
  # LAMBDA FUNCTIONS - all from the one code package in src/.
  # Timeouts of 29 s match API Gateway's integration limit (wait= caps at 20).
  # ===========================================================================
  ListsFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs24.x
      Handler: lists.handler
      Code: ./src
      Role: !GetAtt ListsRole.Arn
      MemorySize: 512
      Timeout: 29
      Environment:
        Variables:
          BASE_URL: !Sub 'https://${ApiHostLabel}.${Domain}/v1'
          LISTS_TABLE: !Ref ListsTable
          VARS_TABLE: !Ref ListsVarsTable
          COUNTERS_TABLE: !Ref ListsCountersTable
          CLEANUP_TABLE: !Ref ListsCleanupTable
          IMPORT_BUCKET: !Ref ListsImportBucket
          WORKER_FUNCTION: !Ref ListsWorkerFunction

  # Background bulk import and shard cleanup, invoked asynchronously by ListsFunction.
  ListsWorkerFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs24.x
      Handler: lists_import.worker
      Code: ./src
      Role: !GetAtt ListsWorkerRole.Arn
      MemorySize: 1769
      Timeout: 900
      Environment:
        Variables:
          LISTS_TABLE: !Ref ListsTable
          IMPORT_BUCKET: !Ref ListsImportBucket

  ListsWorkerInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref ListsWorkerFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 0

  # Send and attachments: PDF/Office extraction and large MIME builds are CPU-bound.
  MailFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: mail.handler
      Code: ./src
      Role: !GetAtt MailRole.Arn
      MemorySize: 1769
      Timeout: 29
      Environment:
        Variables:
          BASE_URL: !Sub 'https://${ApiHostLabel}.${Domain}/v1'
          MAIL_TABLE: !Ref MailTable
          MAIL_DOMAIN: !Ref Domain
          INBOUND_BUCKET: !Sub '${BucketPrefix}-mail-inbound-${AWS::AccountId}-${AWS::Region}'
          ATTACHMENT_BUCKET: !Ref MailAttachmentBucket
          ALLOWED_TO: !Ref EmailSendAllowedTo
          ALLOWED_DOMAINS: !Ref EmailSendAllowedDomains

  # Same code as MailFunction, sized for pop/reset/clear - pop?wait=20 holds it open.
  MailInboxFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: mail.handler
      Code: ./src
      Role: !GetAtt MailRole.Arn
      MemorySize: 256
      Timeout: 29
      Environment:
        Variables:
          BASE_URL: !Sub 'https://${ApiHostLabel}.${Domain}/v1'
          MAIL_TABLE: !Ref MailTable
          MAIL_DOMAIN: !Ref Domain
          INBOUND_BUCKET: !Sub '${BucketPrefix}-mail-inbound-${AWS::AccountId}-${AWS::Region}'
          ATTACHMENT_BUCKET: !Ref MailAttachmentBucket
          ALLOWED_TO: !Ref EmailSendAllowedTo
          ALLOWED_DOMAINS: !Ref EmailSendAllowedDomains

  # S3-triggered: parses mail SES stored under inbound/.
  MailReceiveFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: mail_receive.handler
      Code: ./src
      Role: !GetAtt MailReceiveRole.Arn
      MemorySize: 1024
      Timeout: 60
      Environment:
        Variables:
          MAIL_TABLE: !Ref MailTable
          MAIL_DOMAIN: !Ref Domain

  MailReceiveInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt MailReceiveFunction.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:${AWS::Partition}:s3:::${BucketPrefix}-mail-inbound-${AWS::AccountId}-${AWS::Region}'

  WebhookFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: webhook.handler
      Code: ./src
      Role: !GetAtt WebhookRole.Arn
      MemorySize: 256
      Timeout: 29
      Environment:
        Variables:
          BASE_URL: !Sub 'https://${ApiHostLabel}.${Domain}/v1'
          WEBHOOK_TABLE: !Ref WebhookTable
          WEBHOOK_RETENTION_DAYS: !Ref WebhookRetentionDays

  TotpFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: totp.handler
      Code: ./src
      Role: !GetAtt TotpRole.Arn
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          BASE_URL: !Sub 'https://${ApiHostLabel}.${Domain}/v1'
          TOTP_TABLE: !Ref TotpTable

  LockFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: lock.handler
      Code: ./src
      Role: !GetAtt LockRole.Arn
      MemorySize: 128
      Timeout: 29
