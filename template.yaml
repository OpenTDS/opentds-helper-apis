  RootDefault5xxResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RootApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'*'"
      ResponseTemplates:
        application/json: '{"error": $context.error.messageString, "gatewayError": "$context.error.responseType"}'

  # Bump this logical id when V1Api resources or methods change.
  V1DeploymentC:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [V1RootMethod, V1ProxyMethod, ListsMethod, ListsProxyMethod, NamesMethod, NamesProxyMethod, LockMethod, LockProxyMethod, MailMethod, MailProxyMethod, MailPopMethod, MailResetMethod, MailClearMethod, SmsMethod, SmsProxyMethod, VoiceMethod, VoiceProxyMethod, WebhookMethod, WebhookProxyMethod, TotpMethod, TotpProxyMethod, QrMethod, QrProxyMethod, PerfMethod, PerfProxyMethod, V1Default4xxResponse, V1Default5xxResponse]
    Properties:
      RestApiId: !Ref V1Api

  V1Stage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref V1Api
      DeploymentId: !Ref V1DeploymentC
      StageName: live
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingRateLimit: !Ref ThrottleRateLimit
          ThrottlingBurstLimit: !Ref ThrottleBurstLimit

  # Bump this logical id when RootApi resources or methods change.
  RootDeploymentA:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [RootRootMethod, RootProxyMethod, RootDefault4xxResponse, RootDefault5xxResponse]
    Properties:
      RestApiId: !Ref RootApi

  RootStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref RootApi
      DeploymentId: !Ref RootDeploymentA
      StageName: live
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingRateLimit: !Ref ThrottleRateLimit
          ThrottlingBurstLimit: !Ref ThrottleBurstLimit

Outputs:
  BaseUrl:
    Description: v1 base URL
    Value: !Sub 'https://${ApiHostLabel}.${Domain}/v1'
  LlmsGuide:
    Description: Point an AI assistant here
    Value: !Sub 'https://${ApiHostLabel}.${Domain}/v1/llms.txt'
  OpenApi:
    Description: OpenAPI 3.0.3 (Postman Import > Link)
    Value: !Sub 'https://${ApiHostLabel}.${Domain}/v1/openapi.json'
  SiteUrl:
    Description: Landing page
    Value: !If [MakeApexSite, !Sub 'https://${Domain}/', !Sub 'https://${ApiHostLabel}.${Domain}/']
  MailDomain:
    Description: Addresses at this domain are caught by mail/pop
    Value: !Ref Domain
  ListsImportBucketName:
    Value: !Ref ListsImportBucket
  MailAttachmentBucketName:
    Value: !Ref MailAttachmentBucket
  MailInboundBucketName:
    Value: !Ref MailInboundBucket
  MailTableName:
    Value: !Ref MailTable
  VoiceBucketName:
    Value: !Ref VoiceBucket
