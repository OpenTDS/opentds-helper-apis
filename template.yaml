          SMS_ALLOWED_NUMBERS: !Ref SmsSendAllowedNumbers
          SMS_REGION: !Ref SmsRegion
          SMS_SEND_INTERVAL: !Ref SmsSendIntervalSeconds

  # Speech comes from Polly in VoiceRegion; the audio is stored in this region.
  VoiceFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: voice.handler
      Code: ./src
      Role: !GetAtt VoiceRole.Arn
      MemorySize: 512
