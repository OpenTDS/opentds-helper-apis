              - Effect: Allow
                Action: [s3:PutObject]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${BucketPrefix}-mail-inbound-${AWS::AccountId}-${AWS::Region}/attachments/*'

  WebhookRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
